# Publica o seminário (presentation/) no GitHub Pages a cada push na main.
name: Publicar apresentação

on:
  push:
    branches: [main]
    paths: ["presentation/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site (só os arquivos do deck)
        run: |
          mkdir _site
          cp -r presentation/index.html presentation/css presentation/js presentation/data presentation/img presentation/vendor _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
